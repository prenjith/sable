<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 1200px;
    height: 630px;
    background: radial-gradient(circle at 20% 0%, #17301f 0%, #0f1419 60%);
    color: #d7e0e8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 56px 64px;
  }
  .top { display: flex; align-items: center; gap: 22px; }
  .top img { width: 92px; height: 92px; }
  h1 { margin: 0; font-size: 76px; color: #7ee787; letter-spacing: -2px; }
  h2 { margin: 0; font-size: 40px; line-height: 1.2; max-width: 900px; }
  h2 span { color: #8b9aa8; }
  .chips { display: flex; gap: 12px; flex-wrap: wrap; }
  .chip {
    border: 1px solid #26313b;
    background: #161d24;
    color: #c9d7e3;
    border-radius: 999px;
    padding: 9px 16px;
    font-size: 20px;
    font-family: ui-monospace, Menlo, monospace;
  }
  .bottom { display: flex; justify-content: space-between; align-items: flex-end; }
  .url { font-family: ui-monospace, Menlo, monospace; font-size: 22px; color: #7ee787; }
  .note { font-size: 19px; color: #8b9aa8; }
</style>
</head>
<body>
  <div class="top">
    <img src="../logo.svg" alt="Sable logo">
    <h1>Sable</h1>
  </div>
  <div>
    <h2>A small language for big ideas.<br><span>Learn it in an afternoon. Ship a real script.</span></h2>
    <div class="chips" style="margin-top:28px">
      <div class="chip">pattern matching</div>
      <div class="chip">pipelines</div>
      <div class="chip">classes</div>
      <div class="chip">concurrency</div>
      <div class="chip">browser playground</div>
      <div class="chip">native binaries</div>
    </div>
  </div>
  <div class="bottom">
    <div class="url">github.com/prenjith/sable</div>
    <div class="note">zero-install playground included</div>
  </div>
</body>
</html>
