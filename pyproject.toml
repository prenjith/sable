[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sable-lang"
version = "0.8.0"
description = "A small scripting language with classes, concurrency, and pattern matching"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pranav R" }]

[project.scripts]
sable = "sable:main"
sable-lsp = "lsp:main"

[tool.setuptools]
py-modules = ["sable", "lsp"]
